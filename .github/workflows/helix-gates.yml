name: Helix gates

on:
  push:
    paths:
      - 'helix/**'
      - 'examples/**'
      - '.github/workflows/helix-gates.yml'
  pull_request:
    paths:
      - 'helix/**'
      - 'examples/**'
      - '.github/workflows/helix-gates.yml'
  workflow_dispatch:

jobs:
  gate-13-tests:
    name: Gate 13 unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run argument-graph checker tests
        run: python helix/gates/13-argument-graph/test_check.py

  gate-13-example-graphs:
    name: Gate 13 verifies all example graphs
    runs-on: ubuntu-latest
    needs: gate-13-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify every committed argument_graph.json
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          failed=0
          # the standalone example in the gate dir
          for f in helix/gates/13-argument-graph/example_graph.json; do
            echo "::group::Checking $f"
            if python helix/gates/13-argument-graph/check.py "$f"; then
              echo "ok"
            else
              echo "::error file=$f::gate 13 failed on $f"
              failed=1
            fi
            echo "::endgroup::"
          done
          # every example bundle under examples/
          for f in examples/*/argument_graph.json; do
            echo "::group::Checking $f"
            if python helix/gates/13-argument-graph/check.py "$f"; then
              echo "ok"
            else
              echo "::error file=$f::gate 13 failed on $f"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed
