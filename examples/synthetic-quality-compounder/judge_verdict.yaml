key_findings:
  - "Bull's load-bearing 80% conversion factor moved to 75% under Bear's precedent attack; the original was not well-sourced."
  - "Bull's 22x multiple is the peak peer multiple, not the median. Under Bear's pressure Bull revised to 20x, which is still above the 19x peer median for similar growth profiles."
  - "Bull's revised IRR (9.5%) is below the desk's 10% threshold. Bull acknowledged but did not concede the implication."
  - "Counter-construction (separate artifact) flagged the conversion-rate precedent independently; debate corroborated."
  - "Bear's 4.3% customer-concentration counter from the appendix is unaddressed by the paper as drafted."

constitutional_check:
  passed: false
  provisions_invoked:
    - "§II.3 - 88-92% conversion claim in Bull's turn 1 is not in appendix"
    - "§II.5 - kill switch is quantitative but only on EV revenue and GM; does not cover multiple compression"
    - "§III.6 - argument graph extracted but the 'multiple-rerating' node (claim_rerate_22x) has only weak inbound justification (top_decile_roic + moat_intact); does not include the explicit peer-multiple analog the Bull eventually argued"
  notes: |
    Two distinct constitutional issues. (a) An asserted fact (88-92% conversion)
    is not in the appendix - violates §II.3 and would have been caught by gate 13
    if the extractor had created a node for it. The extractor missed it because
    the figure is in the Bull's debate, not the paper body. (b) The kill switch
    does not cover the multiple-compression risk that the Bear surfaced.

rationale: |
  Bear wins decisively. The paper as drafted does not ship.

  The substantive issue is that during the debate, Bull was forced to revise
  the central thesis twice: FY28 EPS from $5.65 to $5.50, exit multiple from
  22x to 20x, position size from 1.5% to 1.0%, entry rule from $84 to $78.
  The revised thesis sits below the desk's 10% IRR threshold (9.5%). A paper
  that survives only by being revised mid-debate to a position the analyst
  did not originally publish is not a paper that has cleared the gate.

  The procedural issue is constitutional. Section II.3 requires every
  quantitative claim to be backed by a named source row. The 88-92%
  conversion-rate figure cited by the Bull is not in the appendix. The
  multiple-compression risk that the Bear surfaced is not covered by the
  paper's kill switch (only EV revenue and GM are).

  The counter-construction agent (run in parallel) flagged the conversion-rate
  precedent independently. Two independent attack vectors converging on the
  same node is a strong signal.

  Recommendation: the paper does not ship. It is rewritten with: (a) the
  conversion-rate sensitivity table, (b) a multiple anchored to peer median
  with explicit justification for any premium, (c) a kill switch extended
  to multiple compression, and (d) the missing source row for the
  industrial-automation conversion rate. If the rewritten paper's IRR is
  below 10% at conservative inputs, it does not ship at all.

publication_recommendation:
