rationale: |
  Bull (short-thesis defender) wins decisively. Paper ships.

  The substantive case is unusually strong because the Bull defended *both*
  contested points — the off-price recognition (turn 3) and the
  brand-reacceleration precedent (turn 5) — by absorbing the criticism and
  showing the thesis stands without the contested input. That is the
  signature of a robust short: it doesn't depend on a single load-bearing
  claim.

